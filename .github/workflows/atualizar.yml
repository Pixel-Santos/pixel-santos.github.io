name: Atualizar site a partir do Notion

on:
  schedule:
    # todos os dias as 9h no horario de Brasilia (12h UTC)
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # botao "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # o build.py usa o sips (que so existe no Mac) para comprimir as fotos.
      # aqui no servidor Linux usamos o ImageMagick no lugar.
      - name: Instalar ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Gerar o site
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 build.py

      - name: Publicar as mudancas
        run: |
          git config user.name "Pixel Santo bot"
          git config user.email "actions@github.com"
          git add site
          git diff --staged --quiet || git commit -m "Atualiza catalogo a partir do Notion"
          git push
